Properties:
  Property:
    - name: logpattern
      value: "%-5level %d{yyyy-MM-dd HH:mm:ss.SSS}%replace{%notEmpty{ [%notEmpty{bc-rid=%.-2X{blockchainRID}:%.4X{blockchainRID}}%notEmpty{, chain-id=%X{chainIID}}%notEmpty{, block-rid=%.-2X{blockRID}:%.4X{blockRID}}]}}{\\[, }{[} - [%t] %c{1} %msg%n"

Appenders:
  Console:
    name: ConsoleAppender
    target: SYSTEM_OUT
    PatternLayout:
      pattern: ${logpattern}

  RollingFile:
    name: LogToRollingFile
    fileName: ${env:CHR_LOG_FOLDER:-logs}/chromia-cli.log
    filePattern: "${env:CHR_LOG_FOLDER:-logs}/chromia-cli-%d{MM-dd-yyyy}-%i.log.gz"
    createOnDemand: true
    PatternLayout:
      pattern: ${logpattern}
    Policies:
      SizeBasedTriggeringPolicy:
        size: 10MB
    DefaultRollOverStrategy:
      max: 10

Loggers:
  Root:
    level: warn
    AppenderRef:
      - ref: LogToRollingFile
  Logger:
    - name: net.postchain
      level: ${env:CHR_LOG_LEVEL:-info}
      additivity: false
      AppenderRef:
        - ref: ConsoleAppender
        - ref: LogToRollingFile
          level: warn
    - name: net.postchain.gtv.merkle
      level: error
    - name: net.postchain.network.peer.DefaultPeerCommunicationManager
      level: info