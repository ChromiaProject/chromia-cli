Properties:
  Property:
  - name: logpattern
    value: "%-5level %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n"

Appenders:
 Console:
   name: ConsoleAppender
   target: SYSTEM_OUT
   PatternLayout:
     pattern: ${logpattern}

 RollingFile:
   name: LogToRollingFile
   fileName: ${sys:CHR_LOG_FOLDER:-logs}/chromia-cli.log
   filePattern: "${sys:CHR_LOG_FOLDER:-logs}/chromia-cli-%d{MM-dd-yyyy}-%i.log.gz"
   PatternLayout:
     pattern: ${logpattern}
   Policies:
     SizeBasedTriggeringPolicy:
       size: 10MB
   DefaultRollOverStrategy:
     max: 10

Loggers:
  Root:
    level: ${sys:CHR_LOG_LEVEL:-warn}
    AppenderRef:
      - ref: LogToRollingFile
  Logger:
    - name: net.postchain
      level: ${sys:CHR_LOG_LEVEL:-info}
      additivity: false
      AppenderRef:
        - ref: ConsoleAppender
        - ref: LogToRollingFile